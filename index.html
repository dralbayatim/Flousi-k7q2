button.wcard,button.wgold,button.wtile,button.ptile{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--sh);padding:12px 14px;min-height:0;font-weight:500}
button.wcard{flex:0 0 46%;max-width:200px;scroll-snap-align:start}button.wcard .wn,button.wgold .wn{font-size:.86rem;color:var(--mute);font-weight:700}button.wcard b{font-size:1.25rem;font-family:var(--fn);direction:ltr}button.wcard small,button.wgold small,button.wtile small,button.ptile small{font-size:.78rem;color:var(--mute);font-weight:400}
button.wcard.liab b{color:var(--bad)}.wown{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wown button.wcard{max-width:none}
button.wgold{grid-column:1/-1;border:1.5px solid var(--wait)}button.wgold .r{width:100%;border:0;padding:0}button.wgold b{font-size:1.5rem;font-family:var(--fn)}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.wtile b{font-size:.95rem}
.wact{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.wact button{margin:0}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button.ptile{align-items:center;text-align:center;padding:10px 6px}button.ptile i{font-style:normal;font-size:1.4rem;color:var(--wait)}button.ptile b{font-size:.86rem}
section.reconbar{border:1.5px solid var(--wait)}
.tpair{display:flex;align-items:center;gap:8px;margin-bottom:6px}.tend{flex:1;background:var(--soft);border-radius:var(--rb);padding:8px 12px}.tend small{display:block;color:var(--mute);font-size:.78rem}.tend b{font-size:1rem}
button.tswap{margin:0;min-height:40px;min-width:40px;padding:0;border-radius:50%;background:var(--soft);color:var(--acc);font-size:1.2rem}
#snack .snb{display:flex;gap:6px;flex:none}
button.mline{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:10px 0 0;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:var(--rb);box-shadow:var(--sh);padding:9px 14px;min-height:44px;font-weight:500;font-size:.92rem}button.mline b{font-family:var(--fn);direction:ltr}
.qhome{margin:14px 0 4px}
section.upns h2{margin-bottom:6px}.upn{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}.upn:last-of-type{border-bottom:0}
button.upnb{flex:1;display:flex;align-items:flex-start;gap:10px;margin:0;padding:10px 2px;min-height:44px;background:transparent;color:var(--ink);border:0;text-align:right;font-weight:500;line-height:1.6}button.upnb i{font-style:normal;flex:none;width:22px;text-align:center}
.upn.lv-red button.upnb{color:var(--bad)}.upn.lv-warn button.upnb span{color:var(--ink)}.upn.lv-warn button.upnb i{color:var(--wait)}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button.itile{margin:0;display:flex;align-items:center;gap:10px;background:var(--soft);color:var(--ink);border:0;border-radius:var(--rb);padding:12px;min-height:52px;font-weight:700;text-align:right}button.itile i{font-style:normal;font-size:1.2rem}
.wl{margin:6px 0;color:var(--mute)}.wl rect[data-k]{cursor:pointer}.dwhy{display:flex;flex-direction:column;gap:4px;margin-top:6px}.dwhy button{align-self:flex-start}.tx.dfocus{background:var(--soft);border-radius:var(--rb);padding:8px}
#coach{position:fixed;inset:0;z-index:20;background:rgba(8,14,13,.55)}#coach .cring{position:fixed;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}
#coach .cbub{position:fixed;left:16px;right:16px;max-width:520px;margin:0 auto;background:var(--bar);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.95rem;line-height:1.7;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#coach .cfoot{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:536px;margin:0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}#coach .cfoot small{color:#fff}#coach .cbelow{background:var(--bar);color:var(--ink);border-radius:14px;padding:8px 14px;text-align:right;font-size:.9rem;line-height:1.7}#coach .cbelow ul{margin:2px 0 0;padding:0 18px 0 0}#coach .cfoot button{margin:0}
button.upnx{margin:0;min-height:36px;min-width:36px;padding:0;background:transparent;color:var(--mute);border:0;font-size:1.2rem}
