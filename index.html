<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<!-- CSP: السكربتات من ملفات التطبيق فقط (لا سكربت مضمن ولا eval ولا مصدر خارجي). الأنماط المضمنة مسموحة لأن الواجهة تستعملها. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فلوسي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلوسي">
<meta name="theme-color" content="#0f5f5a">
<style>
:root{--bg:#eef2f1;--ink:#16282a;--mute:#5a6e70;--line:#c9d6d4;--acc:#0f5f5a;--ok:#1f7a3d;--bad:#b3261e;--wait:#8a5a00;--btn:#0f5f5a;--btnt:#fff;--bar:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10191a;--ink:#e6efee;--mute:#93a6a8;--line:#2b3b3d;--acc:#5fc4bb;--ok:#6fd08a;--bad:#ff8a80;--wait:#e0b050;--btn:#5fc4bb;--btnt:#0b1415;--bar:#16221f}}
*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--bg)}
body{margin:0 auto;max-width:560px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 86px);font:16px/1.6 -apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;color:var(--ink)}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.02rem;margin:0 0 6px;color:var(--acc)}
section,.card{background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.card.dim{opacity:.6}.quick{display:flex;flex-wrap:wrap}.quick button{margin:4px 0 0 8px}p{margin:0 0 8px}.mut{color:var(--mute);font-size:.88rem}
.big{font-size:2rem;font-weight:700;margin:2px 0 6px}.okc{color:var(--ok)}.warnc{color:var(--wait)}.badc,.bad{color:var(--bad)}
.r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.r b{font-weight:600;text-align:left;direction:ltr}
.tx{border-bottom:1px solid var(--line);padding:7px 0}.tx.void{opacity:.55}
button,.btn{font:inherit;background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:9px 14px;margin:6px 0 0 8px;min-height:44px;display:inline-block;text-decoration:none}
button.alt,.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}button.mini{min-height:34px;padding:4px 10px;font-size:.85rem}
button.lnk{display:block;width:100%;text-align:right;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:13px 4px}
button.prim{display:block;width:100%;margin:14px 0 0;min-height:50px;font-weight:700;font-size:1.05rem}
.fold{margin:0}.fold>summary{cursor:pointer;font-weight:600;color:var(--acc);min-height:44px;display:flex;align-items:center;list-style:none}.fold>summary::-webkit-details-marker{display:none}.fold>summary::before{content:'◂';margin-left:8px;transition:transform .15s}.fold[open]>summary::before{transform:rotate(-90deg)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.seg button{margin:0;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:6px 12px;min-height:38px}.seg button.on{background:var(--btn);color:var(--btnt)}
.f{display:block;margin:8px 0}.f span{display:block;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;width:100%;padding:12px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.orow{display:block}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--bar);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;margin:0;background:transparent;color:var(--mute);border:0;border-radius:8px;min-height:46px;padding:4px}nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}
#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock[hidden]{display:none}#lock input{max-width:220px;text-align:center;font-size:1.6rem;letter-spacing:.4em}
.ticker{background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.9rem}.ticker.warn{border-color:var(--wait);color:var(--wait)}.ticker.alert{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:4px 2px;border-bottom:1px solid var(--line);text-align:right}td:last-child,th:last-child{text-align:left;direction:ltr}
nav button{font-size:.78rem;padding:4px 1px;white-space:nowrap}
.chip{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:20px;font-weight:600;vertical-align:middle;white-space:nowrap}.c-cur{background:#d9f2e1;color:#1f7a3d}.c-old{background:#fbeccd;color:#8a5a00}.c-na{background:#e3e7e7;color:#5a6e70}
@media (prefers-color-scheme:dark){.c-cur{background:#1f3b2a;color:#6fd08a}.c-old{background:#3d2f12;color:#e0b050}.c-na{background:#2b3b3d;color:#93a6a8}}
.nrow .nv{text-align:left;direction:ltr}.nrow .nv b{direction:ltr}.nold b,.nold td{opacity:.55;text-decoration:line-through dotted}
.hdr{display:flex;justify-content:space-between;align-items:center}.gear{background:transparent;color:var(--acc);border:1px solid var(--line);font-size:1.3rem;min-height:44px;min-width:44px;padding:0;margin:0}h2.sub{margin:14px 4px 0}
.chart svg{display:block}.sig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.sig:last-child{border:0}.dot{width:11px;height:11px;border-radius:50%;margin-top:8px;flex:none}
.verdict{border:1px solid var(--wait);border-radius:12px;padding:10px 12px}.verdict b{font-size:1.15rem;color:var(--wait)}.news{padding:8px 0;border-bottom:1px solid var(--line)}.news:last-child{border:0}.news .t{font-weight:600}
.seg button{font-size:.88rem}
.hb{margin:6px 0}.hbt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.hbf{height:100%;background:var(--acc);border-radius:6px}.hbf.late{background:var(--wait)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px}.lg.col{flex-direction:column}.dn{display:flex;gap:14px;align-items:center}
.adv{border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.7;border:1px solid var(--line)}.adv b{display:block}.a-red{border-color:var(--bad);color:var(--bad)}.a-warn{border-color:var(--wait);color:var(--wait)}.a-ok{border-color:var(--ok);color:var(--ok)}.a-info{border-color:var(--acc)}
.advt{color:var(--ink);margin:4px 0}.adv .quick{margin-top:4px}
.tk{display:flex;gap:8px;align-items:baseline;cursor:pointer;min-height:2.6em}.tkl{flex:none;font-size:.75rem;background:var(--line);color:var(--ink);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div id="lock" hidden></div>
<div id="app">…</div>
<nav id="nav"></nav>
<div id="toast"></div>
<script src="core.js"></script>
<script src="engine.js"></script>
<script src="logic.js"></script>
<script src="store.js"></script>
<script src="backup.js"></script>
<script src="selftest.js"></script>
<script src="selftest2.js"></script>
<script src="nabd.js"></script>
<script src="mind.js"></script>
<script src="advisor.js"></script>
<script src="selftest3.js"></script>
<script src="app.js"></script>
<script src="register.js"></script>
</body>
</html>
